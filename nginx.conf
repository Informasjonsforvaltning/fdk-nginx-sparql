worker_processes auto;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}
http {
    map $http_x_forwarded_for $client_ip {
    # Default to $remote_addr if X-Forwarded-For is empty
    "" $remote_addr;
    # Extract the second to last IP
    ~^(?:[^,]+,)*([^,]+),[^,]+$ $1;
    # Use the only IP if there's just one
    ~^[^,]+$ $1;
    }
    limit_req_zone $client_ip zone=addr_limit:10m rate=15r/s;
    limit_req_status 429;
    limit_conn_zone $client_ip zone=conn_limit:10m;

    ## Logging configuration with timing information
    log_format sparql_timing '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time" '
                             'client_ip=$client_ip xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log sparql_timing;
    error_log /var/log/nginx/error.log warn;

    ## Client body temp path for large request bodies
    client_body_temp_path /var/cache/nginx/client_temp 1 2;

    ## Proxy cache configuration
    # proxy_cache_path /data/nginx/cache keys_zone=my_cache:15m max_size=5g inactive=15m
    #                  loader_threshold=300 loader_files=200 use_temp_path=off;

    server_tokens off;
    ## Main Server Block
    server {
        # Use the mapped $client_ip
        set_real_ip_from 10.0.0.0/8;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        ## Open by default.
        listen                8080;
        server_name           default_server;
        client_max_body_size  200M;
        client_body_timeout   300s;

        # Only allow valid HTTP methods
        if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH)$) {
            return 405;
        }

        # Enable compression both for HTTP/1.0 and HTTP/1.1.
        gzip_http_version  1.1;

        # Compression level (1-9).
        # 5 is a perfect compromise between size and cpu usage, offering about
        # 75% reduction for most ascii files (almost identical to level 9).
        gzip_comp_level    5;

        # Gzip compression
        gzip on;
        gzip_types      text/plain text/turtle application/sparql-query application/sparql-results+json application/sparql-results+xml;
        gzip_min_length 1000;

        # Compress data even for clients that are connecting to us via proxies,
        # identified by the "Via" header (required for CloudFront).
        gzip_proxied       any;

        # Tell proxies to cache both the gzipped and regular version of a resource
        # whenever the client's Accept-Encoding capabilities header varies;
        # Avoids the issue where a non-gzip capable client (which is extremely rare
        # today) would display gibberish if their proxy gave them the gzipped version.
        gzip_vary          on;

        add_header 'Vary' 'Accept, Accept-Encoding';
        add_header X-Robots-Tag 'noindex, nofollow, nosnippet, noarchive' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        #healthcheck
        location /ready {
            access_log off;
            return 200 "ready\n";
            add_header Content-Type text/plain;
        }

        #livenesscheck
        location /ping {
            access_log off;
            return 200 "pong\n";
            add_header Content-Type text/plain;
        }

        location / {
            add_header 'Access-Control-Allow-Origin' 'data.norge.no';
            # Add headers for rate limiting
            add_header X-RateLimit-Limit 15 always;
            add_header X-RateLimit-Burst 30 always;
            add_header X-RateLimit-Delay 15 always;
            limit_req zone=addr_limit burst=30 delay=15;
            limit_conn conn_limit 10;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                #
                # Custom headers and headers various browsers *should* be OK with but aren't
                #
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                #
                # Tell client that this pre-flight info is valid for 20 days
                #
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            if ($request_method = 'POST') {
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            }
            if ($request_method = 'GET') {
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            }
            # Proxy buffer configuration for large request bodies
            client_body_buffer_size 128k;
            proxy_request_buffering off;
            proxy_http_version 1.1;

            # Proxy response buffering
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 32 8k;
            proxy_busy_buffers_size 16k;

            # Timeouts for long-running queries
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Proxy caching
            # proxy_cache my_cache;
            # proxy_cache_methods GET HEAD;
            # proxy_cache_valid 200 15m;
            # proxy_cache_key "$request_method$request_uri$args";
            # proxy_cache_bypass $http_pragma $http_authorization;
            # proxy_cache_lock on;
            # proxy_cache_lock_timeout 5s;
            # proxy_cache_use_stale updating error timeout;
            # add_header X-Cache-Status $upstream_cache_status always;

            # Proxy max temp file size
            proxy_max_temp_file_size 0;

            # Forward client information to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            rewrite /(.*) /fuseki/fdk/query$1 break;
            proxy_pass http://fdk-sparql-service:8080;
        }

    }
}
